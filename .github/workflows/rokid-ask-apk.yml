name: Rokid Ask APK

# Builds the Rokid Glasses app and publishes the APK as a downloadable artifact, so the
# glasses can be flashed without installing Android Studio locally.
on:
  push:
    paths:
      - 'rokid-glasses-ask/**'
      - '.github/workflows/rokid-ask-apk.yml'
  pull_request:
    paths:
      - 'rokid-glasses-ask/**'
      - '.github/workflows/rokid-ask-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rokid-glasses-ask

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('rokid-glasses-ask/**/*.gradle.kts', 'rokid-glasses-ask/gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug
        continue-on-error: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rokid-ask-debug-apk
          path: rokid-glasses-ask/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rokid-ask-lint-report
          path: rokid-glasses-ask/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
